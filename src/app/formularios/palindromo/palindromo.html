<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
    <div class="row">

        <div class="col-6">

            <form>

                <div class="form-group pt-4">
                    <label for="frase">Frase:</label>
                    <input [(ngModel)]="frase" name="frase"
                        type="text" class="form-control"
                        id="frase" placeholder="Ingrese una frase">
                </div>

                <br>

                <button (click)="analizar()" type="button"
                    class="btn btn-primary">
                    Analizar
                </button>

            </form>

        </div>

        <div class="col-6">

            <h2>Número de vocales: {{numeroVocales}}</h2>
            <h2>Vocales: {{vocales}}</h2>

            <h2>Número de consonantes: {{numeroConsonantes}}</h2>
            <h2>Consonantes: {{consonantes}}</h2>

            <h2>{{resultado}}</h2>

        </div>

    </div>
</div>
</body>
</html>
