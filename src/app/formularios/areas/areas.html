<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="col-6">
           <form>
                <div class="form-group pt-4">
                    <label for="num1">Número 1:</label>
                    <input [(ngModel)]="num1" name="num1" type="text"
                        class="form-control" id="num1"
                        placeholder="Ingrese número 1">
                </div>

                <div class="form-group pt-4">
                    <label for="num2">Número 2:</label>
                    <input [(ngModel)]="num2" name="num2" type="text"
                        class="form-control" id="num2"
                        placeholder="Ingrese número 2">
                </div>

                <br>

                <input type="radio" name="calcular" value="circulo"
                    [(ngModel)]="calcular">
                <label>Círculo</label>

                <br>

                <input type="radio" name="calcular" value="pentagono"
                    [(ngModel)]="calcular">
                <label>Pentágono</label>

                <br>

                <input type="radio" name="calcular" value="rectangulo"
                    [(ngModel)]="calcular">
                <label>Rectángulo</label>

                <br>

                <input type="radio" name="calcular" value="triangulo"
                    [(ngModel)]="calcular">
                <label>Triángulo</label>

                <br><br>

                <button (click)="operacion()" type="button"
                    class="btn btn-primary">
                    Calcular
                </button>

            </form>
        </div>
        <div class="col-6">
            <h2>Resultado: {{resultado}}</h2>
        </div>
    </div>
</body>
</html>
