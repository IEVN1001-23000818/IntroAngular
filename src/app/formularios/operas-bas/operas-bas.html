<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                 <form>     <!-- Hacer formulario  -->
            <div class="form-group pt-4"> 
                <label for="num1">Número 1:</label>
                <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese número 1">
            </div>
            <div class="foem-group pt4">
                <label for="num2">Número 2:</label>
                <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese número 2">
            </div>
            <br />
                <input type="radio" name="calcular" value="sumar" [(ngModel)]="calcular">  <!-- ngModel sirve para conectar con la función -->
                <label>Sumar +</label>
            <br />
                <input type="radio" name="calcular" value="restar" [(ngModel)]="calcular"> <!-- type="radio" es para hacer las opciones enves de botones -->
                <label>Restar -</label>
            <br />
                <input type="radio" name="calcular" value="multiplicar" [(ngModel)]="calcular"> <!-- name tiene que ser el mismo si no queremos que se seleccionen varias cosas -->
                <label>Multiplicar *</label>
             <br />
                <input type="radio" name="calcular" value="dividir" [(ngModel)]="calcular">
                <label>Dividir /</label>
            <br />
                <button (click)="operacion()" type="button" class="btn btn-primary">
                Calcular
                </button>

            <!-- <button (click)="sumar()" type="button" class="btn btn-primary">
                Sumar
            </button>
            <button (click)="restar()" type="button" class="btn btn-danger">
                Restar
            </button>
            <button (click)="multiplicar()" type="button" class="btn btn-success">
                Multiplicar
            </button>
            <button (click)="dividir()" type="button" class="btn btn-primary">
                Dividir
            </button> -->
          </form>
            </div>
            <div class="col-6">
                <h2>Resultado: {{resultado}}</h2>
            </div>




         
       
        </div>
    </div>
    
</body>
</html>
